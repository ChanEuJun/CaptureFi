<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>capturefi</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@200;300;400&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Content -->
        <div class="content" id="content">
            <div class="url-section">
                <div class="url-display" id="urlDisplay">
                    <span id="urlText">loading...</span>
                </div>
            </div>

            <button class="save-button" id="saveButton">
                <span class="button-text" id="buttonText">capture</span>
                <svg class="checkmark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>
        </div>

        <!-- Error State -->
        <div class="error-state" id="errorState" style="display: none;">
            <h2 class="error-title">failed</h2>
            <button class="retry-button" id="retryButton">retry</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
